name: remote_retro_dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # postgres
      - "4000:4000"   # phoenix (app shares this network namespace)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  app:
    build: .
    # share db's network so `hostname: "localhost"` works unchanged
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    stdin_open: true
    tty: true
    # Google OAuth creds (export KEY=value lines); gitignored
    env_file:
      - path: ../env.sh
        required: false
    environment:
      # Vertex AI ADC from host gcloud (`gcloud auth application-default login`)
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ..:/app
      # build artifacts live in volumes, not on the host
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/assets/node_modules
      - ${HOME}/.config/gcloud:/gcloud:ro
      # hide host .git so tooling can't install hooks into it
      - type: tmpfs
        target: /app/.git
    command: ["bash", "-c", "mix setup && mix phx.server"]

volumes:
  pgdata:
  deps:
  build:
  node_modules:
