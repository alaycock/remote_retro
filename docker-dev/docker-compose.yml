name: remote_retro_dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # postgres
      - "4000:4000"   # phoenix (app shares this network namespace)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # Cloud SQL Auth Proxy to the shared staging database (see deploy/setup-staging.sh).
  # Dev uses it when DEV_DATABASE_URL is set in ../env.sh; tests always use `db`.
  staging-db:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
    command: ["--address", "0.0.0.0", "--port", "5432", "hb-remote-retro:us-central1:remote-retro-db"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud-remote-retro:/gcloud:ro
    restart: unless-stopped

  app:
    build: .
    # share db's network so `hostname: "localhost"` works unchanged
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
      staging-db:
        condition: service_started
        required: false
    working_dir: /app
    stdin_open: true
    tty: true
    # Google OAuth creds (export KEY=value lines); gitignored
    env_file:
      - path: ../env.sh
        required: false
    environment:
      # Vertex AI ADC kept separate from any other gcloud identity on the host
      # (see docker-dev/README.md for how to create it)
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ..:/app
      # build artifacts live in volumes, not on the host
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/assets/node_modules
      - ${HOME}/.config/gcloud-remote-retro:/gcloud:ro
      # hide host .git so tooling can't install hooks into it
      - type: tmpfs
        target: /app/.git
    command: ["bash", "-c", "mix setup && mix phx.server"]

volumes:
  pgdata:
  deps:
  build:
  node_modules:
