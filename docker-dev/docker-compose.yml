name: remote_retro_dev

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # postgres
      - "4000:4000"   # phoenix (app shares this network namespace)
      - "8080:8080"   # webpack dev server
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  app:
    build: .
    # share db's network so config's `hostname: "localhost"` works unchanged
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      REMOTE_RETRO_GOOGLE_OAUTH_CLIENT_ID: ${REMOTE_RETRO_GOOGLE_OAUTH_CLIENT_ID:-}
      REMOTE_RETRO_GOOGLE_OAUTH_CLIENT_SECRET: ${REMOTE_RETRO_GOOGLE_OAUTH_CLIENT_SECRET:-}
      REMOTE_RETRO_GOOGLE_OAUTH_REDIRECT_URI: ${REMOTE_RETRO_GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:4000/auth/google/callback}
    volumes:
      - ..:/app
      # build artifacts live in volumes, not on the host
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/node_modules
      # hide host .git so husky etc. can't install hooks into it
      - type: tmpfs
        target: /app/.git
    command: ["bash", "-c", "mix phx.server"]

volumes:
  pgdata:
  deps:
  build:
  node_modules:
